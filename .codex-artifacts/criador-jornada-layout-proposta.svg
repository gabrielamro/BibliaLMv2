<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Proposta de layout para Criador de Sala</title>
  <desc id="desc">Mockup da pagina Criador de Jornada reorganizada como um estudio de sala, com menu reduzido, painel de dados da sala, lista central de aulas e painel de publicacao.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2d2a26" flood-opacity="0.10"/>
    </filter>
    <filter id="tinyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#2d2a26" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="coverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b7c93"/>
      <stop offset="0.55" stop-color="#c5a059"/>
      <stop offset="1" stop-color="#5d4037"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#f0ebe2"/>
    </linearGradient>
    <style>
      .bg { fill: #f3efe7; }
      .surface { fill: #ffffff; }
      .surface2 { fill: #fbfaf7; }
      .surface3 { fill: #f6f1e8; }
      .ink { fill: #2d2a26; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .muted { fill: #766f66; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .soft { fill: #9a9187; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .gold { fill: #c5a059; }
      .leather { fill: #5d4037; }
      .blue { fill: #34699a; }
      .green { fill: #2f855a; }
      .red { fill: #b4533d; }
      .line { stroke: #e7dfd2; stroke-width: 1; }
      .line2 { stroke: #d8cdbc; stroke-width: 1; }
      .dash { stroke: #d8cdbc; stroke-width: 2; stroke-dasharray: 8 8; }
      .small { font-size: 14px; }
      .xs { font-size: 12px; }
      .xxs { font-size: 10px; letter-spacing: 1.4px; }
      .label { font-size: 11px; letter-spacing: 1.3px; font-weight: 800; text-transform: uppercase; }
      .body { font-size: 15px; }
      .h1 { font-size: 30px; font-weight: 850; }
      .h2 { font-size: 20px; font-weight: 800; }
      .h3 { font-size: 16px; font-weight: 800; }
      .btn { font-size: 13px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1600" height="1000" class="bg"/>

  <!-- App shell: collapsed application menu -->
  <rect x="0" y="0" width="78" height="1000" fill="#fbfaf7"/>
  <line x1="78" y1="0" x2="78" y2="1000" class="line2"/>
  <rect x="18" y="18" width="42" height="42" rx="12" fill="#f1eadf"/>
  <path d="M31 32h16M31 39h16M31 46h16" stroke="#5d4037" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="39" cy="94" r="18" fill="#c5a059"/>
  <text x="39" y="99" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, Arial" font-size="15" font-weight="900">B</text>
  <g fill="none" stroke="#9a9187" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="27" y="150" width="24" height="24" rx="5"/>
    <path d="M27 211h24M31 203h16M31 219h16"/>
    <circle cx="39" cy="277" r="12"/>
    <path d="M29 338h20l-10-17z"/>
    <path d="M27 396h24v20H27zM31 392v8M47 392v8"/>
  </g>
  <rect x="19" y="462" width="40" height="40" rx="12" fill="#c5a059"/>
  <path d="M39 473v18M30 482h18" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>
  <g fill="none" stroke="#9a9187" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 560h22M28 570h22M28 580h14"/>
    <circle cx="39" cy="870" r="13"/>
  </g>

  <!-- Main header -->
  <rect x="78" y="0" width="1522" height="92" fill="#ffffff" filter="url(#tinyShadow)"/>
  <text x="116" y="30" class="soft xxs">WORKSPACE PASTORAL / CRIADOR DE SALA</text>
  <text x="116" y="63" class="ink h1">Vida de Oração</text>
  <rect x="360" y="34" width="92" height="28" rx="14" fill="#f7efe0"/>
  <circle cx="377" cy="48" r="5" fill="#c5a059"/>
  <text x="392" y="52" class="muted xs" font-weight="800">Rascunho</text>
  <rect x="1168" y="26" width="104" height="42" rx="12" fill="#fbfaf7" stroke="#e7dfd2"/>
  <text x="1220" y="51" text-anchor="middle" class="muted btn">Visualizar</text>
  <rect x="1284" y="26" width="92" height="42" rx="12" fill="#fbfaf7" stroke="#e7dfd2"/>
  <text x="1330" y="51" text-anchor="middle" class="muted btn">Salvar</text>
  <rect x="1388" y="26" width="150" height="42" rx="12" fill="#2f855a"/>
  <text x="1463" y="51" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, Arial" font-size="13" font-weight="850">Publicar sala</text>

  <!-- Tabs -->
  <rect x="116" y="118" width="1422" height="62" rx="18" fill="#ffffff" filter="url(#tinyShadow)"/>
  <rect x="132" y="132" width="140" height="34" rx="12" fill="#5d4037"/>
  <text x="202" y="154" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, Arial" font-size="13" font-weight="850">Visão geral</text>
  <text x="332" y="154" text-anchor="middle" class="muted btn">Aulas</text>
  <text x="438" y="154" text-anchor="middle" class="muted btn">Alunos</text>
  <text x="566" y="154" text-anchor="middle" class="muted btn">Publicação</text>
  <text x="1456" y="154" text-anchor="end" class="soft small">Autosave ativo</text>
  <circle cx="1476" cy="149" r="6" fill="#2f855a"/>

  <!-- Left room setup panel -->
  <rect x="116" y="208" width="330" height="718" rx="22" class="surface" filter="url(#softShadow)"/>
  <text x="142" y="244" class="soft label">Dados essenciais</text>
  <rect x="142" y="266" width="278" height="146" rx="18" fill="url(#coverGrad)"/>
  <rect x="166" y="298" width="92" height="24" rx="12" fill="rgba(255,255,255,0.24)"/>
  <text x="184" y="315" fill="#fff" font-family="Inter, Segoe UI, Arial" font-size="12" font-weight="800">Capa da sala</text>
  <path d="M324 349c28-42 58-42 86 0v63h-86z" fill="#fff" opacity="0.18"/>
  <text x="142" y="448" class="soft label">Nome da sala</text>
  <rect x="142" y="462" width="278" height="46" rx="12" class="surface2" stroke="#e7dfd2"/>
  <text x="162" y="491" class="ink h3">Vida de Oração</text>
  <text x="142" y="538" class="soft label">Descrição curta</text>
  <rect x="142" y="552" width="278" height="84" rx="12" class="surface2" stroke="#e7dfd2"/>
  <text x="162" y="580" class="muted body">Uma sala para formar</text>
  <text x="162" y="604" class="muted body">hábitos bíblicos de oração.</text>
  <text x="142" y="666" class="soft label">Organização</text>
  <rect x="142" y="684" width="86" height="36" rx="12" fill="#f7efe0"/>
  <text x="185" y="707" text-anchor="middle" class="leather btn">Semanal</text>
  <rect x="236" y="684" width="82" height="36" rx="12" class="surface2" stroke="#e7dfd2"/>
  <text x="277" y="707" text-anchor="middle" class="muted btn">Diário</text>
  <rect x="326" y="684" width="94" height="36" rx="12" class="surface2" stroke="#e7dfd2"/>
  <text x="373" y="707" text-anchor="middle" class="muted btn">Mensal</text>
  <text x="142" y="760" class="soft label">Acesso</text>
  <rect x="142" y="776" width="278" height="50" rx="14" class="surface2" stroke="#e7dfd2"/>
  <text x="162" y="806" class="ink h3">Privado com convite</text>
  <path d="M396 796l8 8 8-8" fill="none" stroke="#9a9187" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="142" y="856" width="278" height="42" rx="12" fill="#fbfaf7" stroke="#e7dfd2"/>
  <text x="281" y="882" text-anchor="middle" class="muted btn">Editar configurações avançadas</text>

  <!-- Center lessons area -->
  <rect x="474" y="208" width="690" height="718" rx="22" class="surface" filter="url(#softShadow)"/>
  <text x="504" y="244" class="soft label">Estrutura da sala</text>
  <text x="504" y="276" class="ink h2">Aulas</text>
  <text x="578" y="276" class="soft body">12 aulas em 4 semanas</text>
  <rect x="957" y="234" width="176" height="44" rx="14" fill="#c5a059"/>
  <path d="M981 246v20M971 256h20" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="1058" y="261" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, Arial" font-size="13" font-weight="850">Nova aula</text>

  <rect x="504" y="310" width="600" height="66" rx="18" fill="#f7f2e9" stroke="#e7dfd2"/>
  <circle cx="536" cy="343" r="16" fill="#5d4037"/>
  <text x="536" y="348" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, Arial" font-size="12" font-weight="900">1</text>
  <text x="566" y="338" class="ink h3">Semana 1: Fundamentos da oração</text>
  <text x="566" y="360" class="muted xs">3 aulas - arraste para reorganizar</text>
  <rect x="1010" y="326" width="74" height="32" rx="12" class="surface" stroke="#e7dfd2"/>
  <text x="1047" y="346" text-anchor="middle" class="muted xs" font-weight="800">Editar</text>

  <g filter="url(#tinyShadow)">
    <rect x="524" y="400" width="560" height="78" rx="16" class="surface"/>
    <circle cx="554" cy="439" r="18" fill="#f6ead3"/>
    <text x="554" y="444" text-anchor="middle" class="gold h3">1</text>
    <text x="586" y="431" class="ink h3">Por que oramos?</text>
    <text x="586" y="454" class="muted xs">Texto, vídeo e reflexão final</text>
    <rect x="948" y="420" width="78" height="28" rx="14" fill="#e6f4ed"/>
    <text x="987" y="439" text-anchor="middle" class="green xs" font-weight="850">Pronta</text>
    <path d="M1055 432l8 8 8-8" fill="none" stroke="#9a9187" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="524" y="492" width="560" height="78" rx="16" class="surface"/>
    <circle cx="554" cy="531" r="18" fill="#f6ead3"/>
    <text x="554" y="536" text-anchor="middle" class="gold h3">2</text>
    <text x="586" y="523" class="ink h3">Oração no secreto</text>
    <text x="586" y="546" class="muted xs">Conteúdo em revisão</text>
    <rect x="930" y="512" width="96" height="28" rx="14" fill="#fff6df"/>
    <text x="978" y="531" text-anchor="middle" class="leather xs" font-weight="850">Rascunho</text>
    <path d="M1055 524l8 8 8-8" fill="none" stroke="#9a9187" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="524" y="584" width="560" height="78" rx="16" class="surface"/>
    <circle cx="554" cy="623" r="18" fill="#f6ead3"/>
    <text x="554" y="628" text-anchor="middle" class="gold h3">3</text>
    <text x="586" y="615" class="ink h3">Modelo de Jesus</text>
    <text x="586" y="638" class="muted xs">Aguardando conteúdo</text>
    <rect x="920" y="604" width="106" height="28" rx="14" fill="#edf2fb"/>
    <text x="973" y="623" text-anchor="middle" class="blue xs" font-weight="850">Planejada</text>
    <path d="M1055 616l8 8 8-8" fill="none" stroke="#9a9187" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="524" y="686" width="560" height="58" rx="16" fill="#fbfaf7" class="dash"/>
  <path d="M746 706v18M737 715h18" stroke="#c5a059" stroke-width="2.4" stroke-linecap="round"/>
  <text x="778" y="720" class="gold btn">Adicionar aula nesta semana</text>

  <rect x="504" y="776" width="600" height="66" rx="18" fill="#f7f2e9" stroke="#e7dfd2"/>
  <circle cx="536" cy="809" r="16" fill="#5d4037"/>
  <text x="536" y="814" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, Arial" font-size="12" font-weight="900">2</text>
  <text x="566" y="804" class="ink h3">Semana 2: Prática diária</text>
  <text x="566" y="826" class="muted xs">3 aulas - colapsada</text>
  <path d="M1060 800l10 10-10 10" fill="none" stroke="#9a9187" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right publish panel -->
  <rect x="1192" y="208" width="346" height="718" rx="22" class="surface" filter="url(#softShadow)"/>
  <text x="1220" y="244" class="soft label">Pronto para publicar</text>
  <text x="1220" y="276" class="ink h2">Checklist da sala</text>
  <text x="1220" y="305" class="muted small">Troca o wizard por revisão contínua.</text>
  <rect x="1220" y="334" width="290" height="10" rx="5" fill="#efe7da"/>
  <rect x="1220" y="334" width="218" height="10" rx="5" fill="#2f855a"/>
  <text x="1220" y="370" class="green h3">75% completo</text>

  <g class="body" font-family="Inter, Segoe UI, Arial">
    <circle cx="1232" cy="410" r="10" fill="#2f855a"/>
    <path d="M1227 410l4 4 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1254" y="415" class="ink body">Dados essenciais preenchidos</text>

    <circle cx="1232" cy="454" r="10" fill="#2f855a"/>
    <path d="M1227 454l4 4 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1254" y="459" class="ink body">Capa definida</text>

    <circle cx="1232" cy="498" r="10" fill="#2f855a"/>
    <path d="M1227 498l4 4 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1254" y="503" class="ink body">Pelo menos 1 aula pronta</text>

    <circle cx="1232" cy="542" r="10" fill="#f1eadf" stroke="#d8cdbc"/>
    <text x="1254" y="547" class="muted body">Avaliação final opcional</text>

    <circle cx="1232" cy="586" r="10" fill="#f1eadf" stroke="#d8cdbc"/>
    <text x="1254" y="591" class="muted body">Convites e participantes</text>
  </g>

  <line x1="1220" y1="626" x2="1510" y2="626" class="line"/>
  <text x="1220" y="662" class="soft label">Experiência do aluno</text>
  <rect x="1220" y="684" width="290" height="118" rx="18" fill="url(#paperGrad)" stroke="#e7dfd2"/>
  <rect x="1238" y="704" width="82" height="82" rx="16" fill="url(#coverGrad)"/>
  <text x="1338" y="728" class="ink h3">Vida de Oração</text>
  <text x="1338" y="754" class="muted xs">4 semanas - 12 aulas</text>
  <rect x="1338" y="770" width="116" height="24" rx="12" fill="#e6f4ed"/>
  <text x="1396" y="786" text-anchor="middle" class="green xxs" font-weight="900">INSCRIÇÕES ABERTAS</text>

  <text x="1220" y="842" class="soft label">Ações rápidas</text>
  <rect x="1220" y="860" width="136" height="42" rx="12" fill="#f7efe0"/>
  <text x="1288" y="886" text-anchor="middle" class="leather btn">Gerar com IA</text>
  <rect x="1374" y="860" width="136" height="42" rx="12" class="surface2" stroke="#e7dfd2"/>
  <text x="1442" y="886" text-anchor="middle" class="muted btn">Importar aulas</text>

  <!-- Bottom insight strip -->
  <rect x="116" y="948" width="1422" height="34" rx="17" fill="#2d2a26" opacity="0.94"/>
  <text x="142" y="970" fill="#fdfbf7" font-family="Inter, Segoe UI, Arial" font-size="13" font-weight="800">Recomendação UX:</text>
  <text x="278" y="970" fill="#fdfbf7" font-family="Inter, Segoe UI, Arial" font-size="13">manter criação inicial simples, mas transformar as 4 etapas em abas + checklist para gestão recorrente da sala.</text>
</svg>
